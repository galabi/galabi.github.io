<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>רשימת קניות · Shopping List</title>
<style>
  body { margin: 0; background: #f2f2f7; color: #1c1c1e; font: 17px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; text-align: center; }
  main { max-width: 480px; margin: 0 auto; padding: 48px 16px; }
  a.button { display: block; margin: 12px 0; padding: 12px; border-radius: 10px; background: #0066cc; color: #ffffff; text-decoration: none; }
  a.secondary { background: none; color: #0066cc; }
  p { margin: 6px 0; }
</style>
</head>
<body>
<main>
  <h1>רשימת קניות</h1>
  <p>הוזמנת לרשימת קניות משותפת. התקינו את האפליקציה, ואז לחצו שוב על הקישור.</p>
  <p dir="ltr">You’ve been invited to a shared shopping list. Install the app, then tap the link again.</p>
  <a class="button" href="https://apps.apple.com/app/id6816899167">App Store</a>
  <a class="button secondary" id="open" href="supermarketlist://join">פתח באפליקציה · Open in the app</a>
</main>
<script>
  var token = new URLSearchParams(location.search).get('t') || ''
  document.getElementById('open').href = 'supermarketlist://join?t=' + encodeURIComponent(token)
  setTimeout(function () { location.href = 'https://apps.apple.com/app/id6816899167' }, 1200)
</script>
</body>
</html>
