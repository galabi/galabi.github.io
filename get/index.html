<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>רשימת קניות · Shopping List</title>
<meta property="og:title" content="רשימת קניות · Shopping List">
<meta property="og:description" content="רשימות קניות משותפות שעובדות גם בלי אינטרנט, עם מיון לפי מדורי הסופר.">
<style>
  body { margin: 0; background: #f2f2f7; color: #1c1c1e; font: 17px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; text-align: center; }
  main { max-width: 480px; margin: 0 auto; padding: 48px 16px; }
  a.button { display: block; margin: 12px 0; padding: 12px; border-radius: 10px; background: #0066cc; color: #ffffff; text-decoration: none; }
  p { margin: 6px 0; }
  [hidden] { display: none; }
</style>
</head>
<body>
<main>
  <h1>רשימת קניות</h1>
  <p>רשימות קניות משותפות שעובדות גם בלי אינטרנט, עם מיון לפי מדורי הסופר.</p>
  <p dir="ltr">Shared shopping lists that work offline, sorted by supermarket aisle.</p>
  <a class="button" id="appstore" href="https://apps.apple.com/app/id6816899167?pt=129525522&ct=__C__&mt=8">App Store</a>
  <a class="button" id="play" href="https://play.google.com/store/apps/details?id=com.galabisira.supermarketlist&referrer=utm_source%3D__C__" hidden>Google Play</a>
  <div id="android" hidden>
    <p>האפליקציה זמינה כרגע לאייפון בלבד.</p>
    <p dir="ltr">The app is iPhone-only for now.</p>
  </div>
</main>
<script>
  var c = new URLSearchParams(location.search).get('c') || ''
  if (!/^[a-z0-9_-]{1,30}$/.test(c)) c = 'get'
  var appStore = 'https://apps.apple.com/app/id6816899167?pt=129525522&ct=__C__&mt=8'.replace('__C__', c)
  var play = 'https://play.google.com/store/apps/details?id=com.galabisira.supermarketlist&referrer=utm_source%3D__C__'.replace('__C__', c)
  document.getElementById('appstore').href = appStore
  document.getElementById('play').href = play
  var ua = navigator.userAgent
  var ios = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1)
  if (/android/i.test(ua)) {
    if (false) location.replace(play)
    else {
      document.getElementById('appstore').hidden = true
      document.getElementById('android').hidden = false
    }
  } else if (ios) {
    location.replace(appStore)
  }
</script>
</body>
</html>
